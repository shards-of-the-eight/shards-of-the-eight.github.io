<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shards of the Eight - Payment</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1b1626; color: #fff6d8; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { color: #e8b53c; font-size: 22px; }
</style>
</head>
<body>
<main>
  <h1>Shards of the Eight</h1>
  <p id="m">Opening the secure payment window...</p>
  <p><a href="./privacy.html" style="color:#6fb4e0">Privacy</a> &middot; <a href="./terms.html" style="color:#6fb4e0">Terms</a> &middot; <a href="./refunds.html" style="color:#6fb4e0">Refunds</a> &middot; <a href="./pricing.html" style="color:#6fb4e0">Pricing</a></p>
</main>
<!-- Paddle's checkout opens itself for the ?_ptxn=… transaction (created by our payment server). -->
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
  // Public client-side token from Paddle > Developer tools > Authentication (safe to publish). Empty = payments not set up.
  var PADDLE_TOKEN = 'live_2e6f2162c16eeaacf6c0a2d1319';
  var PADDLE_SANDBOX = false;
  var paid = false;
  // Started from the Home Screen app: the page after payment says to switch back to it.
  var fromApp = new URLSearchParams(location.search).has('app');
  var paidPage = location.origin + location.pathname.replace(/pay\.html$/, 'paid.html');
  if (!PADDLE_TOKEN || !window.Paddle) {
    location.href = './paid.html?cancelled=1' + (fromApp ? '&app=1' : '');
  } else {
    if (PADDLE_SANDBOX) Paddle.Environment.set('sandbox');
    Paddle.Initialize({
      token: PADDLE_TOKEN,
      checkout: { settings: { displayMode: 'overlay', theme: 'dark', successUrl: paidPage + (fromApp ? '?app=1' : '') } },
      eventCallback: function (e) {
        if (e && e.name === 'checkout.completed') paid = true;
        if (e && e.name === 'checkout.closed' && !paid) location.href = './paid.html?cancelled=1' + (fromApp ? '&app=1' : '');
      }
    });
  }
</script>
</body>
</html>
